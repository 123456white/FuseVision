name: Build & Test

on:
  push:
    branches: [main, 'codex/ci-*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg/downloads
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg/bincache
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg/bincache,readwrite"
  VCPKG_FEATURE_FLAGS: manifests

jobs:
  documentation:
    uses: ./.github/workflows/docs.yml

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore vcpkg tool cache
        id: cache-vcpkg-tool
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/.git
            vcpkg/.vcpkg-root
            vcpkg/.gitattributes
            vcpkg/.gitignore
            vcpkg/vcpkg.exe
            vcpkg/vcpkgmetricsuploader.exe
            vcpkg/bootstrap-vcpkg.bat
            vcpkg/bootstrap-vcpkg.sh
            vcpkg/scripts
            vcpkg/ports
            vcpkg/triplets
            vcpkg/versions
          key: vcpkg-tool-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-v4
          restore-keys: |
            vcpkg-tool-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-tool-${{ runner.os }}-

      - name: Verify cached vcpkg tool or bootstrap a missing tool
        shell: pwsh
        run: |
          if (-not (Test-Path 'vcpkg')) {
            git clone https://github.com/microsoft/vcpkg.git vcpkg
            if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
            .\vcpkg\bootstrap-vcpkg.bat
            if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          }
          foreach ($required in @('.git', '.vcpkg-root', 'vcpkg.exe', 'scripts/buildsystems/vcpkg.cmake')) {
            if (-not (Test-Path (Join-Path 'vcpkg' $required))) {
              throw "Incomplete vcpkg tool cache: $required"
            }
          }
          Write-Host 'Reusing complete vcpkg tool (including prefix cache matches)'

      - name: Restore vcpkg binary cache
        id: cache-vcpkg-binary
        uses: actions/cache@v4
        with:
          path: vcpkg/bincache
          key: vcpkg-binary-${{ runner.os }}-x64-windows-${{ hashFiles('vcpkg.json') }}-v2
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-x64-windows-

      - name: Ensure binary cache directory
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}")) {
            New-Item -ItemType Directory -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" -Force | Out-Null
          }

      - name: Fetch vcpkg baseline commit
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json)."builtin-baseline"
          if ($baseline) {
            Write-Host "Fetching vcpkg baseline commit: $baseline"
            git -C vcpkg fetch --depth=1 origin $baseline 2>&1
          }

      - name: Check environment
        shell: pwsh
        run: ./scripts/check-env.ps1

      - name: Configure, build and test (Ninja)
        shell: pwsh
        run: ./CmakeBuild.ps1 -Configuration Debug -NoRun -Test

      - name: Configure, build and test (Visual Studio)
        shell: pwsh
        run: ./CmakeBuild.ps1 -Generator VisualStudio -Configuration Debug -NoRun -Test

      - name: Configure, build and test (Release)
        shell: pwsh
        run: ./CmakeBuild.ps1 -Configuration Release -NoRun -Test

      - name: Verify maintained functional traceability
        shell: pwsh
        run: |
          foreach ($report in @('windows-x64-debug/Testing', 'windows-x64-release/Testing', 'windows-vs2022-x64/Testing/Debug')) {
            python -X utf8 scripts/ci/verify_traceability.py --junit "out/build/$report/junit.xml" --output "out/build/$report/traceability.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package Release runtime and verify isolated startup
        shell: pwsh
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: python -X utf8 scripts/ci/package_windows.py --source out/build/windows-x64-release/bin/Release --archive out/delivery/FuseVision-Windows-x64.zip --revision "$env:BUILD_REVISION"

      - name: Upload tested delivery candidate
        uses: actions/upload-artifact@v4
        with:
          name: FuseVision-Delivery-Candidate
          path: out/delivery/*
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FuseVision-Test-Results
          path: |
            out/build/windows-x64-debug/Testing/
            out/build/windows-vs2022-x64/Testing/
            out/build/windows-x64-release/Testing/

  deliver:
    needs: [build-windows, documentation]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: FuseVision-Delivery-Candidate
          path: out/delivery
      - name: Verify downloaded delivery checksum and startup
        run: python -X utf8 scripts/ci/package_windows.py --archive out/delivery/FuseVision-Windows-x64.zip --verify-only
      - name: Deliver versioned Windows package
        uses: actions/upload-artifact@v4
        with:
          name: FuseVision-Windows-x64-${{ github.sha }}
          path: out/delivery/*
          if-no-files-found: error
      - name: Publish tagged prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" out/delivery/* --verify-tag --prerelease --generate-notes
